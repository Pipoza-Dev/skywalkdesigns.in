<section class="panel panel--ink nf" data-theme="dark" aria-labelledby="page-title">
  <div class="aura aura--dark" aria-hidden="true"></div>
  <div class="stack">
    <span class="nf__mark float">{mark}</span>
    <p class="nf__code" aria-hidden="true">404</p>
    <h1 class="t-2" id="page-title">This page took a <em>different path.</em></h1>
    <p class="lead">The page you’re looking for doesn’t exist or has moved.</p>
    <div class="btn-row">
      <a class="btn btn--signal" href="{{root}}index.html">Back to home {arrow}</a>
      <a class="btn btn--glass-dark btn--plain" href="{{root}}projects.html">View projects</a>
    </div>
  </div>
</section>
