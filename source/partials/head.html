<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://lh3.googleusercontent.com; frame-src 'self' https://www.google.com; connect-src 'self' https://skywalk-designs-default-rtdb.firebaseio.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://script.google.com https://script.googleusercontent.com; manifest-src 'self'; base-uri 'self'; form-action 'self'; object-src 'none'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<meta name="theme-color" content="#0f1012">
<meta name="color-scheme" content="light">
<meta name="format-detection" content="telephone=no">
<meta name="author" content="Skywalk Designs">
{{canonical}}
<meta property="og:type" content="{{ogtype}}">
<meta property="og:site_name" content="Skywalk Designs">
<meta property="og:locale" content="en_IN">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:image" content="{{ogimage}}">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="{{root}}favicon.svg" type="image/svg+xml">
<link rel="icon" href="{{root}}favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="{{root}}apple-touch-icon.png">
<link rel="manifest" href="{{root}}site.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
{{preload}}
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&amp;family=Geist+Mono:wght@400;500&amp;family=Instrument+Serif:ital@0;1&amp;display=swap">
<link rel="stylesheet" href="{{root}}assets/css/app.css?v={{v}}">
<script src="{{root}}assets/js/app.js?v={{v}}" defer></script>
{{jsonld}}
